<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple B2 Upload</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 20px;
         background: #0f1115; color: #e6e9ef; line-height: 1.5; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8b93a3; font-family: monospace; margin-bottom: 20px; }
  label { display: block; margin-top: 14px; font-size: 11px; color: #8b93a3;
          text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  input, textarea { width: 100%; padding: 8px 10px; margin-top: 4px;
                    background: #1e222b; color: #e6e9ef; border: 1px solid #2a2f3a;
                    border-radius: 6px; font-family: monospace; font-size: 12px;
                    box-sizing: border-box; }
  textarea { min-height: 60px; resize: vertical; }
  button { margin-top: 18px; padding: 10px 22px; background: #4f8cff; color: #fff;
           border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:hover:not(:disabled) { background: #3a75e0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 20px; padding: 10px 12px; border-radius: 6px; font-family: monospace;
            font-size: 12px; background: #1e222b; border: 1px solid #2a2f3a; }
  #status.ok  { color: #2ecc71; border-color: rgba(46,204,113,.4); }
  #status.err { color: #ff5c5c; border-color: rgba(255,92,92,.4); }
  #result { margin-top: 12px; padding: 12px; background: #1e222b; border: 1px solid #2a2f3a;
            border-radius: 6px; font-family: monospace; font-size: 11px;
            white-space: pre-wrap; word-break: break-all; max-height: 400px;
            overflow: auto; display: none; }
</style>
</head>
<body>

<h1>Simple B2 Upload</h1>
<div class="sub">one video &middot; one image &middot; no database</div>

<label>API Key</label>
<input id="apiKey" type="password" placeholder="X-API-Key" autocomplete="off">

<label>file_key</label>
<input id="fileKey" type="text" placeholder="e.g. jfrnegery_20250223003352">

<label>video_cdn URL</label>
<textarea id="videoCdn" placeholder="https://..."></textarea>

<label>image_cdn URL <span style="text-transform:none; color:#555;">(optional)</span></label>
<textarea id="imageCdn" placeholder="https://..."></textarea>

<button id="btn">Upload</button>

<div id="status">Idle.</div>
<div id="result"></div>

<script>
  const $ = id => document.getElementById(id);
  const API = 'https://b2cloud-ten.vercel.app/api/upload-simple';

  $('apiKey').value = localStorage.getItem('b2_api_key') || '';

  $('btn').addEventListener('click', async () => {
    const apiKey   = $('apiKey').value.trim();
    const fileKey  = $('fileKey').value.trim();
    const videoCdn = $('videoCdn').value.trim();
    const imageCdn = $('imageCdn').value.trim();

    if (!apiKey)   return show('err', 'API key required');
    if (!fileKey)  return show('err', 'file_key required');
    if (!videoCdn) return show('err', 'video_cdn required');

    localStorage.setItem('b2_api_key', apiKey);

    $('btn').disabled = true;
    $('result').style.display = 'none';
    show('', 'Uploading… (may take up to 60 s)');

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
        body: JSON.stringify({
          video_cdn: videoCdn,
          image_cdn: imageCdn || '',
          file_key:  fileKey,
        }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        show('err', `HTTP ${res.status} — ${data.error || 'unknown error'}`);
      } else if (data.video_url) {
        show('ok', 'Video uploaded ✓' + (data.image_url ? ' — Image uploaded ✓' : ''));
      } else {
        show('err', 'Video failed: ' + (data.video_error || 'unknown'));
      }

      $('result').textContent = JSON.stringify(data, null, 2);
      $('result').style.display = 'block';
    } catch (e) {
      show('err', 'Fetch error: ' + e.message);
    } finally {
      $('btn').disabled = false;
    }
  });

  function show(kind, msg) {
    const s = $('status');
    s.textContent = msg;
    s.className = kind;
  }
</script>

</body>
</html>
