<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload to B2 → cdn-to-b2</title>
<link href="app.css" rel="stylesheet">
<style>
  .progress-bar { height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); width:0; transition:width .2s ease; }
  .log { font-family:var(--mono); font-size:11.5px; max-height:400px; overflow:auto;
         background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:8px; }
  .log-line { padding:1px 0; }
  .log-line.err  { color:var(--err); }
  .log-line.ok   { color:var(--ok); }
  .log-line.warn { color:var(--warn); }
</style>
</head>
<body>

<header>
  <h1>Upload to B2 &rarr; cdn-to-b2</h1>
  <div class="sub">load rows &middot; upload &middot; copy URLs</div>
</header>

<main>

  <!-- 1. API key -->
  <section class="panel">
    <h2>1. API key</h2>
    <div id="keyFormArea">
      <div class="field">
        <label for="apiKeyInput">X-API-Key</label>
        <input id="apiKeyInput" type="password" placeholder="paste your X-API-Key" autocomplete="off">
      </div>
      <div class="row">
        <button id="btnSaveKey" class="secondary">Save key</button>
      </div>
    </div>
    <div id="keyStoredArea" class="hidden">
      <div class="stored-row">
        <span class="dot">&#10003;</span>
        <span>API key stored</span>
        <button id="btnChangeKey" class="secondary">Change</button>
        <button id="btnForgetKey" class="secondary">Forget</button>
      </div>
    </div>
  </section>

  <!-- 2. Load rows -->
  <section class="panel">
    <h2>2. Load rows</h2>
    <div class="row">
      <label class="file-btn" id="fileBtnLabel">
        Load JSON file
        <input id="fileInput" type="file" accept=".json,application/json">
      </label>
      <button id="btnLoadFromDb" class="secondary" disabled>Load from DB</button>
      <button id="btnClear" class="secondary">Clear</button>
    </div>
    <div class="field" style="margin-top:10px;">
      <label for="dbUserId">user_id (DB load — optional, empty = all users)</label>
      <input id="dbUserId" type="text" placeholder="e.g. jfrnegery">
    </div>
    <div id="sourceBanner" class="file-banner hidden" style="margin-top:10px;">
      <span class="file-name" id="sourceName"></span>
      <span class="file-size" id="sourceCount"></span>
    </div>
  </section>

  <!-- 3. Upload -->
  <section class="panel hidden" id="uploadPanel">
    <h2>3. Upload</h2>
    <div class="row" style="margin-bottom:10px;">
      <button id="btnUpload">
        Upload all
        <span id="spinnerUpload" class="btn-spinner hidden"></span>
      </button>
      <button id="btnStop" class="secondary hidden">Stop</button>
      <button id="btnCopyAll" class="secondary hidden">Copy all URLs</button>
      <span class="muted" id="uploadSummary"></span>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    <div class="stat-grid" style="margin-top:12px;">
      <div class="stat"><div class="k">Total</div>   <div class="v" id="statTotal">0</div></div>
      <div class="stat"><div class="k">Done</div>    <div class="v" id="statDone">0</div></div>
      <div class="stat"><div class="k">OK</div>      <div class="v" id="statOk">0</div></div>
      <div class="stat"><div class="k">Partial</div> <div class="v" id="statPartial">0</div></div>
      <div class="stat"><div class="k">Failed</div>  <div class="v" id="statFail">0</div></div>
      <div class="stat"><div class="k">Skipped</div> <div class="v" id="statSkip">0</div></div>
    </div>
    <div id="log" class="log hidden" style="margin-top:12px;"></div>
  </section>

  <div id="status" class="status">Idle.</div>

</main>

<script type="module">
const $ = id => document.getElementById(id);

const API_BASE   = 'https://b2cloud-ten.vercel.app';
const UPLOAD_URL = API_BASE + '/api/cdn-to-b2';
const SQL_URL    = API_BASE + '/api/sql';
const KEY_STORE  = 'b2_api_key';

/* elements */
const apiKeyInput    = $('apiKeyInput');
const keyFormArea    = $('keyFormArea');
const keyStoredArea  = $('keyStoredArea');
const btnSaveKey     = $('btnSaveKey');
const btnChangeKey   = $('btnChangeKey');
const btnForgetKey   = $('btnForgetKey');
const fileBtnLabel   = $('fileBtnLabel');
const fileInput      = $('fileInput');
const btnLoadFromDb  = $('btnLoadFromDb');
const btnClear       = $('btnClear');
const dbUserId       = $('dbUserId');
const sourceBanner   = $('sourceBanner');
const sourceName     = $('sourceName');
const sourceCount    = $('sourceCount');
const uploadPanel    = $('uploadPanel');
const btnUpload      = $('btnUpload');
const btnStop        = $('btnStop');
const btnCopyAll     = $('btnCopyAll');
const spinnerUpload  = $('spinnerUpload');
const uploadSummary  = $('uploadSummary');
const progressFill   = $('progressFill');
const statTotal      = $('statTotal');
const statDone       = $('statDone');
const statOk         = $('statOk');
const statPartial    = $('statPartial');
const statFail       = $('statFail');
const statSkip       = $('statSkip');
const logEl          = $('log');
const statusEl       = $('status');

/* state */
let rows             = [];
let videoUrlByKey    = new Map();
let imageUrlByKey    = new Map();
let uploading        = false;
let stopRequested    = false;

/* ---------- API key ---------- */
function getApiKey() {
  try { return localStorage.getItem(KEY_STORE) || ''; } catch { return ''; }
}
function setApiKey(k) {
  try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch {}
}
function refreshKeyUI() {
  const has = !!getApiKey();
  keyFormArea.classList.toggle('hidden', has);
  keyStoredArea.classList.toggle('hidden', !has);
  refreshUi();
}

/* ---------- ui ---------- */
function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function refreshUi() {
  const hasKey  = !!getApiKey();
  const hasRows = rows.length > 0;
  const hasUrls = videoUrlByKey.size > 0 || imageUrlByKey.size > 0;

  btnLoadFromDb.disabled = uploading || !hasKey;
  btnUpload.disabled     = uploading || !hasRows;
  btnClear.disabled      = uploading;
  fileInput.disabled     = uploading;
  fileBtnLabel.style.pointerEvents = uploading ? 'none' : '';
  fileBtnLabel.style.opacity       = uploading ? '.5'   : '';
  spinnerUpload.classList.toggle('hidden', !uploading);
  btnStop.classList.toggle('hidden', !uploading);
  btnCopyAll.classList.toggle('hidden', uploading || !hasUrls);
}

function isUploadable(row) { return !!(row && row.file_key && row.video_cdn); }

function log(msg, kind) {
  logEl.classList.remove('hidden');
  const line = document.createElement('div');
  line.className = 'log-line' + (kind ? ' ' + kind : '');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- set rows ---------- */
function setRows(newRows, label) {
  rows           = newRows;
  videoUrlByKey  = new Map();
  imageUrlByKey  = new Map();

  /* pre-fill URLs from rows that already have them */
  for (const r of rows) {
    if (r.file_key && r.video_url) videoUrlByKey.set(r.file_key, r.video_url);
    if (r.file_key && r.image_url) imageUrlByKey.set(r.file_key, r.image_url);
  }

  if (rows.length === 0) {
    sourceBanner.classList.add('hidden');
    uploadPanel.classList.add('hidden');
    refreshUi();
    return;
  }

  const uploadable = rows.filter(isUploadable).length;
  sourceName.textContent  = label || '';
  sourceCount.textContent = `(${rows.length} loaded · ${uploadable} uploadable)`;
  sourceBanner.classList.remove('hidden');
  uploadPanel.classList.remove('hidden');
  resetStats();
  refreshUi();
}

function resetStats() {
  statTotal.textContent   = rows.filter(isUploadable).length;
  statDone.textContent    = 0;
  statOk.textContent      = 0;
  statPartial.textContent = 0;
  statFail.textContent    = 0;
  statSkip.textContent    = 0;
  progressFill.style.width = '0%';
  uploadSummary.textContent = '';
  logEl.classList.add('hidden');
  logEl.innerHTML = '';
}

/* ---------- API key handlers ---------- */
btnSaveKey.addEventListener('click', () => {
  const k = apiKeyInput.value.trim();
  if (!k) { setStatus('Paste a key first.', 'err'); return; }
  setApiKey(k); apiKeyInput.value = ''; refreshKeyUI();
  setStatus('API key saved.', 'ok');
});
btnChangeKey.addEventListener('click', () => {
  keyFormArea.classList.remove('hidden');
  keyStoredArea.classList.add('hidden');
  apiKeyInput.focus();
});
btnForgetKey.addEventListener('click', () => {
  setApiKey(''); apiKeyInput.value = ''; refreshKeyUI();
  setStatus('API key removed.', '');
});

/* ---------- load: file ---------- */
fileInput.addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const text   = await f.text();
    const parsed = JSON.parse(text);
    let list;
    if (Array.isArray(parsed))                     list = parsed;
    else if (parsed && Array.isArray(parsed.rows)) list = parsed.rows;
    else throw new Error('JSON must be an array or { rows: [...] }');

    list = list.map(r => ({
      file_key:    r.file_key    ?? null,
      likes:       r.likes       ?? null,
      video_cdn:   r.video_cdn   ?? null,
      image_cdn:   r.image_cdn   ?? null,
      date_posted: r.date_posted ?? null,
      user_id:     r.user_id     ?? null,
      status:      r.status      ?? null,
      video_url:   r.video_url   ?? null,
      image_url:   r.image_url   ?? null,
    }));

    if (!dbUserId.value && list[0]?.user_id) dbUserId.value = list[0].user_id;

    setRows(list, f.name);
    setStatus(`Loaded ${list.length} row(s) from "${f.name}".`, 'ok');
  } catch (err) {
    setStatus('File error: ' + err.message, 'err');
  }
});

/* ---------- load: DB ---------- */
btnLoadFromDb.addEventListener('click', async () => {
  const key = getApiKey();
  if (!key) { setStatus('Save an API key first.', 'err'); return; }

  const userId  = dbUserId.value.trim();
  const baseSql = `SELECT "file_key","user_id","likes","video_cdn","image_cdn","date_posted",
                          "status","video_url","image_url"
                   FROM "b2_cloud"
                   WHERE "video_cdn" IS NOT NULL
                     AND "video_url" IS NULL`;
  const sql     = userId
    ? baseSql + ` AND "user_id" = ? ORDER BY "likes" DESC`
    : baseSql + ` ORDER BY "likes" DESC`;
  const params  = userId ? [userId] : [];

  setStatus(userId ? `Querying rows for user_id="${userId}"…` : 'Querying all users…', '');

  try {
    const res = await fetch(SQL_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
      body: JSON.stringify({ sql, params }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const list = (data.rows || []).map(r => ({
      file_key:    r.file_key,
      user_id:     r.user_id,
      likes:       r.likes,
      video_cdn:   r.video_cdn,
      image_cdn:   r.image_cdn,
      date_posted: r.date_posted,
      status:      r.status,
      video_url:   r.video_url,
      image_url:   r.image_url,
    }));
    setRows(list, userId ? `b2_cloud · user_id=${userId}` : 'b2_cloud (all users)');
    setStatus(
      userId
        ? `Loaded ${list.length} uploadable row(s) for user_id="${userId}".`
        : `Loaded ${list.length} uploadable row(s) across all users.`,
      'ok',
    );
  } catch (err) {
    setStatus('DB load failed: ' + err.message, 'err');
  }
});

btnClear.addEventListener('click', () => {
  setRows([], '');
  setStatus('Cleared.', '');
});

/* ---------- copy all ---------- */
btnCopyAll.addEventListener('click', async () => {
  const lines = [];
  for (const [fk, url] of videoUrlByKey.entries()) {
    lines.push(`${fk}\t(video)\t${url}`);
    const img = imageUrlByKey.get(fk);
    if (img) lines.push(`${fk}\t(image)\t${img}`);
  }
  /* orphan images (video failed, image saved) */
  for (const [fk, url] of imageUrlByKey.entries()) {
    if (!videoUrlByKey.has(fk)) lines.push(`${fk}\t(image)\t${url}`);
  }
  if (!lines.length) return;
  const text = lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    setStatus(`Copied ${lines.length} URL(s) to clipboard.`, 'ok');
  } catch {
    window.prompt('Copy URLs:', text);
  }
});

/* ---------- upload helper (retry once on network failure) ---------- */
async function postUpload(row, key) {
  const payload = JSON.stringify({
    video_cdn: row.video_cdn,
    image_cdn: row.image_cdn || '',
    file_key:  row.file_key,
  });

  let lastErr;
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      const res = await fetch(UPLOAD_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
        body:    payload,
      });
      let data = {};
      try { data = await res.json(); } catch {}
      return { res, data };
    } catch (err) {
      lastErr = err;
      if (attempt < 2) {
        log(`retry ${row.file_key} (attempt 2/2) — ${err.message}`, 'warn');
        await new Promise(r => setTimeout(r, 2000));
      }
    }
  }
  throw lastErr;
}

/* ---------- upload loop ---------- */
btnUpload.addEventListener('click', async () => {
  if (uploading) return;
  const key = getApiKey();
  if (!key) { setStatus('Save an API key first.', 'err'); return; }

  const targets = rows.filter(isUploadable);
  if (targets.length === 0) { setStatus('No uploadable rows loaded.', 'err'); return; }

  uploading = true; stopRequested = false;
  resetStats(); refreshUi();

  const total = targets.length;
  let done = 0, ok = 0, fail = 0, skip = 0, partial = 0;
  statTotal.textContent = total;
  setStatus(`Uploading ${total} row(s)…`, '');

  const tick = () => {
    done++;
    statDone.textContent = done;
    progressFill.style.width = `${Math.round(done / total * 100)}%`;
  };

  for (const row of targets) {
  if (stopRequested) { skip++; statSkip.textContent = skip; tick(); continue; }

  try {
    const { res, data } = await postUpload(row, key);

    /* partial — video failed, image saved */
    if (data && data.partial && !data.success) {
      if (data.image_url) imageUrlByKey.set(row.file_key, data.image_url);
      partial++; statPartial.textContent = partial;
      tick(); continue;
    }

    /* full failure */
    if (!res.ok || !data.success) {
      fail++; statFail.textContent = fail;
      tick(); continue;
    }

    /* full success */
    if (data.video_url) videoUrlByKey.set(row.file_key, data.video_url);
    if (data.image_url) imageUrlByKey.set(row.file_key, data.image_url);
    ok++; statOk.textContent = ok;
  } catch (err) {
    fail++; statFail.textContent = fail;
  }
  tick();
}

  uploading = false; stopRequested = false; refreshUi();
  uploadSummary.textContent =
    `done=${done} · ok=${ok} · partial=${partial} · fail=${fail} · skip=${skip}`;
  setStatus(
    `Upload complete — ${ok} ok, ${partial} partial, ${fail} failed, ${skip} skipped.`,
    (fail === 0 && partial === 0) ? 'ok' : (ok === 0 && partial === 0 ? 'err' : 'warn'),
  );
});

btnStop.addEventListener('click', () => {
  stopRequested = true;
  setStatus('Stopping after current row…', 'warn');
});

/* boot */
refreshKeyUI();
</script>
</body>
</html>
